# Free hourly ping: wakes the Render free server and re-checks court dates on watched cases.
name: Hourly court-date check
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub drops many scheduled runs; the app still runs the check at most hourly)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake app and start hourly check
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          SYNC_TOKEN="$(printf %s "$SYNC_TOKEN" | tr -d '[:space:]')"   # strip stray spaces/newlines
          for i in 1 2 3 4; do
            code=$(curl -s -o /tmp/out -w "%{http_code}" -m 90 -X POST \
              -H "X-Cron-Token: $SYNC_TOKEN" -H "X-Requested-With: tcd" \
              https://tx-case-desk.onrender.com/api/cron/hourly) || true
            echo "attempt $i -> $code $(cat /tmp/out 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
